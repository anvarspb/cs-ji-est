name: Update Cito snapshot
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cito-data-writer
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare persistent data branch
        working-directory: app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add --detach ../data FETCH_HEAD
          else
            git worktree add --detach ../data HEAD
            git -C ../data switch --orphan data
            cp deployment-data/state.json ../data/state.json
            cp deployment-data/snapshot.json ../data/snapshot.json
            git -C ../data add state.json snapshot.json
            git -C ../data commit -m 'Initialize verified Cito state'
            git -C ../data push origin HEAD:data
          fi
      - name: Update shared snapshot (no site build)
        working-directory: app
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
          CITO_STATE_DIR: ${{ github.workspace }}/data
          CITO_PERSIST_GIT: '1'
        run: node scripts/update-cito.mjs
      - name: Retain state if update was interrupted
        if: always()
        working-directory: data
        run: |
          if test -f state.json && test -f snapshot.json; then
            git add state.json snapshot.json
            if ! git diff --cached --quiet; then
              git commit -m 'Retain Cito request reservations'
              git push origin HEAD:data
            fi
          fi
